name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    # A real database, because the integration tests skip silently without one —
    # and the bug they found (permissive RLS policies enforcing nothing) is
    # invisible to every unit test in the repository.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nell_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The application role must NOT be able to bypass row-level security. A
      # superuser ignores every policy even on a FORCE'd table, so a suite run as
      # `postgres` would pass while proving the opposite of what it claims.
      # Without this, 45 browser tests skip — and a skipped test is reported in
      # the same summary line as a passing one.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Provision the restricted application role
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d nell_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE nell_app LOGIN PASSWORD 'nell_app' NOSUPERUSER NOBYPASSRLS;
          GRANT USAGE, CREATE ON SCHEMA public TO nell_app;
          SQL

      - name: Migrate and verify row-level security
        env:
          DATABASE_URL: postgres://nell_app:nell_app@localhost:5432/nell_test
        run: node packages/db/scripts/migrate.mjs

      - name: Check (typecheck + lint + test + format + license audit)
        env:
          DATABASE_URL: postgres://nell_app:nell_app@localhost:5432/nell_test
        run: pnpm check

      - name: Build
        run: pnpm build

      # Named separately from `pnpm check` so the verdict is visible in the log
      # rather than buried in a package's test output. A reviewer should be able
      # to see "all attacks refused" without opening a fold.
      - name: Adversarial suite
        run: pnpm attacks
