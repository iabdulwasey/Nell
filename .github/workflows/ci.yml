name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check (typecheck + lint + test + format + license audit)
        run: pnpm check

      - name: Build
        run: pnpm build

      # Named separately from `pnpm check` so the verdict is visible in the log
      # rather than buried in a package's test output. A reviewer should be able
      # to see "all attacks refused" without opening a fold.
      - name: Adversarial suite
        run: pnpm attacks
